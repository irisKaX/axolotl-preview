name: Dashboard Grid Rebuild preview
on:
  push:
    branches: [preview/living-catalog-20261018]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: axolotl-preview-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      baseline_sha: ${{ steps.baseline.outputs.sha }}
    steps:
      - name: Locate the current successful preview artifact
        id: baseline
        uses: actions/github-script@v7
        with:
          script: |
            if(context.repo.repo !== 'axolotl-preview') throw new Error('Preview repository only');
            const {data: pages} = await github.rest.repos.getPages(context.repo);
            if(pages.build_type !== 'workflow' || pages.html_url !== 'https://iriskax.github.io/axolotl-preview/') throw new Error('Unexpected Pages configuration');
            const {data: deployments} = await github.rest.repos.listDeployments({...context.repo,environment:'github-pages',per_page:100});
            const latest = deployments.find(d => d.sha !== context.sha);
            if(!latest) throw new Error('No baseline publication');
            const {data: statuses} = await github.rest.repos.listDeploymentStatuses({...context.repo,deployment_id:latest.id});
            if(statuses[0]?.state !== 'success') throw new Error('Latest publication is not successful; preserve it for review');
            const {data: runs} = await github.rest.actions.listWorkflowRunsForRepo({...context.repo,head_sha:latest.sha,per_page:100});
            for(const run of runs.workflow_runs) {
              const {data} = await github.rest.actions.listWorkflowRunArtifacts({...context.repo,run_id:run.id});
              if(data.artifacts.some(a => a.name === 'github-pages' && !a.expired)) {
                core.setOutput('run',String(run.id));
                core.setOutput('sha',latest.sha);
                core.info(`Preserving publication ${latest.sha} from run ${run.id}`);
                return;
              }
            }
            throw new Error('Current publication artifact is unavailable; do not restore an older preview');
      - uses: actions/checkout@v4
        with:
          repository: irisKaX/axolotl-2
          ref: 29fd04501ce5174040325e0a21443e6f9058d3b0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check the Layout Studio change boundary
        run: |
          git fetch --depth=1 origin 6a21670d09a15135c3b1b0d9ba721f2ebb889930
          git diff --exit-code 6a21670d09a15135c3b1b0d9ba721f2ebb889930 HEAD -- . ':!package.json' ':!package-lock.json' ':!src/pages/design-system/library/layout/' ':!src/pages/design-system/library/registry.tsx' ':!scripts/ds-library/check-grid.mjs' ':!scripts/ds-library/check-built.mjs'
      - run: node node_modules/vitest/vitest.mjs run src/pages/design-system/library/layout/model.test.tsx src/pages/design-system/library/layout/LayoutStudio.test.tsx
      - run: node scripts/ds-library/build.mjs
      - run: npx playwright install --with-deps chromium
      - name: Short grid interaction check
        run: node scripts/ds-library/check-built.mjs --grid-only
      - name: Restore the current complete preview
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: ${{ steps.baseline.outputs.run }}
          github-token: ${{ github.token }}
          repository: irisKaX/axolotl-preview
          path: previous-preview
      - name: Replace only the existing V1.1 preview
        env:
          BASELINE_RUN: ${{ steps.baseline.outputs.run }}
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
        run: |
          mkdir preview-output
          tar --no-same-owner -xf previous-preview/artifact.tar -C preview-output
          python3 - <<'PY'
          import pathlib,hashlib,json,shutil,os
          root=pathlib.Path('preview-output')
          old={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file() and p.relative_to(root).parts[0] != 'ds-library-v1-1'}
          for name in ['lens-02-clean-icon/index.html','rail-02-rounded/index.html','button-studio-01/index.html','dark-veil-lab/index.html','aperture-02-20261018/aperture-02.html','living-catalog-20261018/aperture.html','ds-button-lens-02/index.html','ds-library-v1/index.html']:
              assert name in old,name
          target=root/'ds-library-v1-1'
          assert target.is_dir(), 'Expected existing V1.1 preview'
          if (target/'evidence').is_dir():
              shutil.copytree(target/'evidence','retained-evidence')
          shutil.rmtree(target)
          shutil.copytree('dist',target)
          if pathlib.Path('retained-evidence').exists():
              shutil.copytree('retained-evidence',target/'evidence')
          assert all((root/name).is_file() and hashlib.sha256((root/name).read_bytes()).hexdigest()==digest for name,digest in old.items())
          current={str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()}
          assert all(name.startswith('ds-library-v1-1/') for name in current-set(old))
          (target/'preservation.json').write_text(json.dumps({'baselineRun':int(os.environ['BASELINE_RUN']),'baselineCommit':os.environ['BASELINE_SHA'],'filesPreserved':len(old),'allHashesMatch':True,'previousFiles':old},indent=2))
          print(f'Preserved all {len(old)} other preview files byte-for-byte.')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview-output
          retention-days: 7
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recheck publication before replacement
        uses: actions/github-script@v7
        env:
          BASELINE_SHA: ${{ needs.build.outputs.baseline_sha }}
        with:
          script: |
            const {data}=await github.rest.repos.listDeployments({...context.repo,environment:'github-pages',per_page:100});
            const previous=data.find(d=>d.sha!==context.sha);
            if(!previous || previous.sha!==process.env.BASELINE_SHA) throw new Error('Newer publication detected; refuse stale replacement');
      - uses: actions/deploy-pages@v4
        id: deployment
  verify-public:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: irisKaX/axolotl-2
          ref: 29fd04501ce5174040325e0a21443e6f9058d3b0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify the published version
        run: |
          python3 - <<'PY'
          import urllib.request,json,time
          url='https://iriskax.github.io/axolotl-preview/ds-library-v1-1/provenance.json'
          for attempt in range(12):
              try:
                  data=json.load(urllib.request.urlopen(url,timeout=30))
                  assert data['previewCommit']=='29fd04501ce5174040325e0a21443e6f9058d3b0'
                  break
              except Exception:
                  if attempt==11: raise
                  time.sleep(10)
          PY
      - name: Verify interactions on the existing public preview
        run: node scripts/ds-library/check-grid.mjs
        env:
          LIBRARY_URL: https://iriskax.github.io/axolotl-preview/ds-library-v1-1/
