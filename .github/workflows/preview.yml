name: Canonical Design System Library V1.1
on:
  push:
    branches: [design-system/header-final-polish]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: axolotl-preview-pages
  cancel-in-progress: false
env:
  SOURCE_COMMIT: 63bda318f5556b12b629016e821e08feb7374281
  # Separate immutable test/reference checkouts; neither is the source build.
  TEST_COMMIT: e4757d394d3691b06282e1903f97fef07731473c
  BASELINE_COMMIT: 40693e2b53513701e744b8313e182001c1871af6
  BASELINE_SHA256: ff42865ee9f21a733aef22fa7b21da15279022bcdd728609d9201eda69c10e8b
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: preview
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: irisKaX/axolotl-2
          ref: ${{ env.SOURCE_COMMIT }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: irisKaX/axolotl-2
          ref: ${{ env.TEST_COMMIT }}
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: irisKaX/axolotl-2
          ref: ${{ env.BASELINE_COMMIT }}
          path: reference
          persist-credentials: false
      - run: node scripts/header-polish.mjs apply ../source
        working-directory: preview
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - id: dependencies
        run: npm ci
        working-directory: source
      - id: library-build
        run: node scripts/ds-library/build.mjs
        working-directory: source
      - run: node scripts/header-polish.mjs stamp ../source
        working-directory: preview
      - name: Prepare pinned test overlay (tests only)
        id: test-setup
        working-directory: source
        run: |
          cp ../harness/src/design-system/library/Unification.test.tsx src/design-system/library/Unification.test.tsx
          ln -s "$PWD/node_modules" ../harness/node_modules
      - name: Required TypeScript check
        if: ${{ !cancelled() && steps.test-setup.outcome == 'success' }}
        working-directory: source
        run: npm run typecheck
      - name: Complete unit suite (no narrow allowlist)
        if: ${{ !cancelled() && steps.test-setup.outcome == 'success' }}
        working-directory: source
        run: npm test
      - name: Reference and bridge contracts
        if: ${{ !cancelled() && steps.test-setup.outcome == 'success' }}
        working-directory: source
        run: node --test ../harness/scripts/visual-baseline/contract.test.mjs tests/header-preview-bridge.test.mjs tests/bridge-original-indexation.test.mjs
      - name: Browser dependencies
        id: browser-dependencies
        if: ${{ !cancelled() && steps.test-setup.outcome == 'success' }}
        working-directory: source
        run: npx playwright install --with-deps chromium
      - name: Check native React catalog and mandatory independent baseline
        if: ${{ !cancelled() && steps.library-build.outcome == 'success' && steps.browser-dependencies.outcome == 'success' }}
        working-directory: source
        env:
          LIBRARY_URL: http://127.0.0.1:4185/axolotl-preview/ds-library-v1-1/
          BASELINE_DIR: ${{ github.workspace }}/reference/tests/visual/approved-v1-1
          VISUAL_HARNESS_DIR: ${{ github.workspace }}/harness/scripts/visual-baseline
          BASELINE_OUTPUT: ${{ runner.temp }}/baseline-comparison
          LENS_DIST: ${{ runner.temp }}/lens-site/verification/lens
          LENS_URL: http://127.0.0.1:4197/verification/lens/scripts/button-lens-02/fixture.html
        run: |
          node --input-type=module -e "import {build} from 'vite'; await build({base:'/verification/lens/',build:{outDir:process.env.LENS_DIST,rollupOptions:{input:'scripts/button-lens-02/fixture.html'}}});"
          npm run preview -- --host 127.0.0.1 --port 4185 --base /axolotl-preview/ds-library-v1-1/ --strictPort >"$RUNNER_TEMP/library-preview.log" 2>&1 &
          SERVER_PID=$!
          python3 -m http.server 4197 --bind 127.0.0.1 --directory "$RUNNER_TEMP/lens-site" >"$RUNNER_TEMP/lens-preview.log" 2>&1 &
          LENS_PID=$!
          trap 'kill "$SERVER_PID" "$LENS_PID"' EXIT
          for attempt in $(seq 1 20); do
            curl --fail --silent "$LIBRARY_URL" >/dev/null && curl --fail --silent "$LENS_URL" >/dev/null && break
            sleep 1
          done
          curl --fail --silent "$LIBRARY_URL" >/dev/null
          curl --fail --silent "$LENS_URL" >/dev/null
          # All checks run, but every nonzero exit remains a job failure.
          status=0
          node scripts/ds-library/check-theme.mjs || status=1
          node scripts/ds-library/check-header.mjs || status=1
          node scripts/ds-library/check-contrast.mjs || status=1
          node "$VISUAL_HARNESS_DIR/motion.mjs" "$LIBRARY_URL" || status=1
          node "$VISUAL_HARNESS_DIR/button-states.mjs" "$LIBRARY_URL" || status=1
          node "$VISUAL_HARNESS_DIR/negative.mjs" --baseline "$BASELINE_DIR" --sha256 "$BASELINE_SHA256" --url "$LIBRARY_URL" --report "$RUNNER_TEMP/baseline-negative.json" || status=1
          # No --diagnostic or record/update path: candidate and toolchain mismatch BLOCK.
          node ../preview/scripts/check-header-polish.mjs . || status=1
          exit "$status"
      - name: Preserve test evidence (never part of the Pages artifact)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: baseline-test-evidence
          path: |
            ${{ runner.temp }}/baseline-comparison
            ${{ runner.temp }}/baseline-negative.json
            ${{ runner.temp }}/library-preview.log
            ${{ runner.temp }}/lens-preview.log
          if-no-files-found: warn
          retention-days: 14
      - run: node scripts/assemble-library.mjs ../source/dist ../preview-output
        working-directory: preview
      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview-output
          retention-days: 7
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Confirm the experimental Pages target
        uses: actions/github-script@v7
        with:
          script: |
            if (context.repo.repo !== 'axolotl-preview') throw new Error('Preview repository only');
            const {data} = await github.rest.repos.getPages(context.repo);
            if (data.build_type !== 'workflow' || data.html_url !== 'https://iriskax.github.io/axolotl-preview/') throw new Error('Unexpected Pages target');
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify the published source and retired Playground
        env:
          LIBRARY_URL: https://iriskax.github.io/axolotl-preview/ds-library-v1-1/
          PREVIEW_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          url=os.environ['LIBRARY_URL']+'provenance.json'
          for attempt in range(12):
              try:
                  data=json.load(urllib.request.urlopen(url,timeout=30))
                  assert data['previewCommit']==os.environ['SOURCE_COMMIT']
                  assert data['previewRepositoryCommit']==os.environ['PREVIEW_COMMIT']
                  assert data['previewPatch']['file']=='patches/header-final-polish.patch'
                  assert data['architecture']=='react-canonical-v2'
                  assert data['theme']=='tweakcn-v1'
                  assert data['themeRevision']=='contrast-v1'
                  body=urllib.request.urlopen('https://iriskax.github.io/axolotl-preview/creative-concepts/modular-playground/',timeout=30).read().decode()
                  assert '?section=dashboard#design-system' in body
                  print('Published canonical React Library and Dashboard redirect verified.')
                  break
              except Exception:
                  if attempt==11: raise
                  time.sleep(10)
          PY
