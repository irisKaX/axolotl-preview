name: Button Studio 01 isolated preview
on:
  push:
    branches: [preview/living-catalog-20261018]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: axolotl-preview-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: irisKaX/axolotl-2
          ref: 712e60feb5e8c6f3d65a5e4e5a0cf11cbd1d6e46
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Typecheck and verify source boundary
        run: |
          npm run typecheck
          git fetch --depth=1 origin 85429da3f05115169732887a6ff0a721355b7437
          git diff --name-only 85429da3f05115169732887a6ff0a721355b7437 HEAD > /tmp/changed-files
          python3 - <<'PY'
          import pathlib
          changed=pathlib.Path('/tmp/changed-files').read_text().splitlines()
          assert changed and all(p.startswith('experiments/button-studio-01/') for p in changed),changed
          print('Production files and all prior experiments unchanged.')
          PY
      - name: Build isolated React studio
        run: node experiments/button-studio-01/build.mjs
      - run: npx playwright install --with-deps chromium
      - name: Verify interactions, accessibility and responsive layouts
        run: node experiments/button-studio-01/check-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: button-studio-evidence
          path: experiments/button-studio-01/evidence/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: button-studio-build
          path: experiments/button-studio-01/dist/
          retention-days: 7
      - name: Guard against replacing a newer preview publication
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.repos.listDeployments({owner: context.repo.owner, repo: context.repo.repo, environment: 'github-pages', per_page: 10});
            const latest = data[0];
            if (latest && latest.sha !== 'b776497d8b55d4e8a4e5dbf1a4d1e68fd3e85233') throw new Error('Preview publication changed; stop to preserve newer work.');
      - name: Restore all current preview files including Dark Veil Lab
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: 39154890441
          github-token: ${{ github.token }}
          repository: irisKaX/axolotl-preview
          path: previous-preview
      - name: Add only Button Studio and verify every previous file hash
        run: |
          mkdir -p preview-output
          tar -xf previous-preview/artifact.tar -C preview-output
          python3 - <<'PY'
          import pathlib,hashlib,json
          root=pathlib.Path('preview-output')
          manifest={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert (root/'dark-veil-lab/index.html').is_file()
          assert (root/'aperture-02-20261018/aperture-02.html').is_file()
          assert (root/'living-catalog-20261018/aperture.html').is_file()
          assert not (root/'button-studio-01').exists(), 'Do not overwrite existing experiment'
          pathlib.Path('previous-hashes.json').write_text(json.dumps(manifest))
          PY
          mkdir -p preview-output/button-studio-01/evidence
          cp experiments/button-studio-01/dist/* preview-output/button-studio-01/
          cp experiments/button-studio-01/evidence/* preview-output/button-studio-01/evidence/
          printf '%s\n' '712e60feb5e8c6f3d65a5e4e5a0cf11cbd1d6e46' > preview-output/button-studio-01/source-commit.txt
          python3 - <<'PY'
          import pathlib,hashlib,json
          root=pathlib.Path('preview-output')
          old=json.loads(pathlib.Path('previous-hashes.json').read_text())
          assert all(hashlib.sha256((root/name).read_bytes()).hexdigest()==digest for name,digest in old.items())
          print(f'Preserved {len(old)} existing files byte-for-byte')
          (root/'button-studio-01/preservation.json').write_text(json.dumps({'baseline_run':39154890441,'files_preserved':len(old),'all_hashes_match':True}))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview-output
  deploy:
    if: false
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish only isolated preview host after review
        id: deployment
        uses: actions/deploy-pages@v4
