name: Rail 02 Rounded isolated preview
on:
  push:
    branches: [preview/living-catalog-20261018]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: axolotl-preview-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: irisKaX/axolotl-2
          ref: d1a1b304bee6f3a0c233e55e4d4a8d1b32bbdb0e
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Typecheck and verify source boundary
        run: |
          npm run typecheck
          git fetch --depth=1 origin c9526e96b8be61e2180337e1ea023dfcb662dc23
          git diff --name-only c9526e96b8be61e2180337e1ea023dfcb662dc23 HEAD > /tmp/changed-files
          python3 - <<'PY'
          import pathlib
          changed=pathlib.Path('/tmp/changed-files').read_text().splitlines()
          assert changed and all(p.startswith('experiments/rail-02-rounded/') for p in changed),changed
          print('Production files and all prior experiments unchanged.')
          PY
      - name: Build isolated React studio
        run: node experiments/rail-02-rounded/build.mjs
      - run: npx playwright install --with-deps chromium
      - name: Verify interactions, accessibility and responsive layouts
        run: node experiments/rail-02-rounded/check-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rail-02-evidence
          path: experiments/rail-02-rounded/evidence/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rail-02-build
          path: experiments/rail-02-rounded/dist/
          retention-days: 7
      - name: Guard against replacing a newer preview publication
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.repos.listDeployments({owner: context.repo.owner, repo: context.repo.repo, environment: 'github-pages', per_page: 10});
            const latest = data[0];
            if (latest && latest.sha !== '14c11b8f3a18b5bf23ce9813aa886d57053224e3') throw new Error('Preview publication changed; stop to preserve newer work.');
      - name: Restore all current preview files including Dark Veil Lab
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: 39207429603
          github-token: ${{ github.token }}
          repository: irisKaX/axolotl-preview
          path: previous-preview
      - name: Add only Button Studio and verify every previous file hash
        run: |
          mkdir -p preview-output
          tar -xf previous-preview/artifact.tar -C preview-output
          python3 - <<'PY'
          import pathlib,hashlib,json
          root=pathlib.Path('preview-output')
          manifest={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert (root/'button-studio-01/index.html').is_file()
          assert (root/'dark-veil-lab/index.html').is_file()
          assert (root/'aperture-02-20261018/aperture-02.html').is_file()
          assert (root/'living-catalog-20261018/aperture.html').is_file()
          assert not (root/'rail-02-rounded').exists(), 'Do not overwrite existing experiment'
          pathlib.Path('previous-hashes.json').write_text(json.dumps(manifest))
          PY
          mkdir -p preview-output/rail-02-rounded/evidence
          cp experiments/rail-02-rounded/dist/* preview-output/rail-02-rounded/
          cp experiments/rail-02-rounded/evidence/* preview-output/rail-02-rounded/evidence/
          printf '%s\n' 'd1a1b304bee6f3a0c233e55e4d4a8d1b32bbdb0e' > preview-output/rail-02-rounded/source-commit.txt
          python3 - <<'PY'
          import pathlib,hashlib,json
          root=pathlib.Path('preview-output')
          old=json.loads(pathlib.Path('previous-hashes.json').read_text())
          assert all(hashlib.sha256((root/name).read_bytes()).hexdigest()==digest for name,digest in old.items())
          print(f'Preserved {len(old)} existing files byte-for-byte')
          (root/'rail-02-rounded/preservation.json').write_text(json.dumps({'baseline_run':39207429603,'files_preserved':len(old),'all_hashes_match':True}))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview-output
  deploy:
    if: false
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish only isolated preview host after review
        id: deployment
        uses: actions/deploy-pages@v4
