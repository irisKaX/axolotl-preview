name: Consolidated Library review (no deployment)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: preview
      - uses: actions/checkout@v4
        with:
          repository: irisKaX/axolotl-2
          ref: design-system/consolidate-v1-1
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && node scripts/ds-library/build.mjs
        working-directory: source
      - run: node scripts/assemble-library.mjs ../source/dist ../review-output
        working-directory: preview
      - uses: actions/upload-artifact@v4
        with:
          name: consolidated-library-review
          path: review-output
