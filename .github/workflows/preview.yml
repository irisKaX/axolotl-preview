name: Living Catalog isolated preview
on:
  push:
    branches: [preview/living-catalog-20261018]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: axolotl-preview-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: irisKaX/axolotl-2
          ref: 303d3fba45113bb60d38174f39ae4d7a068abc6a
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build only isolated exploration
        run: node experiments/living-catalog/build.mjs
      - name: Install Chromium for experiment QA
        run: npx playwright install --with-deps chromium
      - name: Check interactions, responsive layout and unchanged header
        run: node experiments/living-catalog/check-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: living-catalog-evidence
          path: experiments/living-catalog/evidence/
          retention-days: 14
      - name: Restore existing preview artifact exactly
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: 39078876114
          github-token: ${{ github.token }}
          repository: irisKaX/axolotl-preview
          path: previous-preview
      - name: Preserve previous labs and add isolated catalog directory
        run: |
          mkdir -p preview-output
          tar -xf previous-preview/artifact.tar -C preview-output
          python3 - <<'PY'
          import pathlib,hashlib,json
          root=pathlib.Path("preview-output")
          manifest={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob("*") if p.is_file()}
          pathlib.Path("previous-hashes.json").write_text(json.dumps(manifest))
          assert not (root/"living-catalog-20261018").exists(), "Do not overwrite an existing experiment"
          PY
          mkdir -p preview-output/living-catalog-20261018/evidence
          cp experiments/living-catalog/dist/*.html preview-output/living-catalog-20261018/
          cp experiments/living-catalog/evidence/* preview-output/living-catalog-20261018/evidence/
          printf '%s\n' '303d3fba45113bb60d38174f39ae4d7a068abc6a' > preview-output/living-catalog-20261018/source-commit.txt
          python3 - <<'PY'
          import pathlib,hashlib,json
          root=pathlib.Path("preview-output")
          old=json.loads(pathlib.Path("previous-hashes.json").read_text())
          assert all(hashlib.sha256((root/name).read_bytes()).hexdigest()==digest for name,digest in old.items())
          print(f"Preserved {len(old)} preexisting files byte-for-byte")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview-output
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish isolated preview host only
        id: deployment
        uses: actions/deploy-pages@v4
