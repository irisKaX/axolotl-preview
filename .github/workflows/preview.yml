name: Axolotl preview deployment

on:
  push:
    branches: [preview/header-responsive-lab]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: axolotl-preview-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed Header Labs commit
        uses: actions/checkout@v4
        with:
          repository: irisKaX/axolotl-2
          ref: 2937dd5a09ad4ef808d358806738b1830c2c69b9
          persist-credentials: false

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Set preview URL base
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("vite.config.ts")
          content = p.read_text()
          old = 'base: "/axolotl-2/",'
          assert content.count(old) == 1, "Unexpected Vite base config"
          p.write_text(content.replace(old, 'base: "/axolotl-preview/",'))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build preview
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
