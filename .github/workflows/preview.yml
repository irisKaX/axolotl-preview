name: Lens 02 Clean Icon isolated preview
on:
  push:
    branches: [preview/living-catalog-20261018]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: axolotl-preview-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: irisKaX/axolotl-2
          ref: 13e9266ecdb5185780101533b9975e6316438b63
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Typecheck and verify source boundary
        run: |
          npm run typecheck
          git fetch --depth=1 origin f280230f2133a8d441821119f5730dcfaa522c8d
          git diff --name-only f280230f2133a8d441821119f5730dcfaa522c8d HEAD > /tmp/changed-files
          python3 - <<'PY'
          import pathlib
          changed=pathlib.Path('/tmp/changed-files').read_text().splitlines()
          assert changed and all(p.startswith('experiments/lens-02-clean-icon/') for p in changed),changed
          print('Production files and all prior experiments unchanged.')
          PY
      - name: Build isolated React studio
        run: node experiments/lens-02-clean-icon/build.mjs
      - run: npx playwright install --with-deps chromium
      - name: Verify interactions, accessibility and responsive layouts
        run: node experiments/lens-02-clean-icon/check-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lens-02-evidence
          path: experiments/lens-02-clean-icon/evidence/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lens-02-build
          path: experiments/lens-02-clean-icon/dist/
          retention-days: 7
      - name: Guard against replacing a newer preview publication
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.repos.listDeployments({owner: context.repo.owner, repo: context.repo.repo, environment: 'github-pages', per_page: 10});
            const latest = data[0];
            if (latest && latest.sha !== 'e6ee331de9f9b242e403f4219030f4732cc4533c') throw new Error('Preview publication changed; stop to preserve newer work.');
      - name: Restore all current preview files including Dark Veil Lab
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: 39211660554
          github-token: ${{ github.token }}
          repository: irisKaX/axolotl-preview
          path: previous-preview
      - name: Add only Lens 02 and verify every previous file hash
        run: |
          mkdir -p preview-output
          tar -xf previous-preview/artifact.tar -C preview-output
          python3 - <<'PY'
          import pathlib,hashlib,json
          root=pathlib.Path('preview-output')
          manifest={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert (root/'rail-02-rounded/index.html').is_file()
          assert (root/'button-studio-01/index.html').is_file()
          assert (root/'dark-veil-lab/index.html').is_file()
          assert (root/'aperture-02-20261018/aperture-02.html').is_file()
          assert (root/'living-catalog-20261018/aperture.html').is_file()
          assert not (root/'lens-02-clean-icon').exists(), 'Do not overwrite existing experiment'
          pathlib.Path('previous-hashes.json').write_text(json.dumps(manifest))
          PY
          mkdir -p preview-output/lens-02-clean-icon/evidence
          cp experiments/lens-02-clean-icon/dist/* preview-output/lens-02-clean-icon/
          cp experiments/lens-02-clean-icon/evidence/* preview-output/lens-02-clean-icon/evidence/
          printf '%s\n' '13e9266ecdb5185780101533b9975e6316438b63' > preview-output/lens-02-clean-icon/source-commit.txt
          python3 - <<'PY'
          import pathlib,hashlib,json
          root=pathlib.Path('preview-output')
          old=json.loads(pathlib.Path('previous-hashes.json').read_text())
          assert all(hashlib.sha256((root/name).read_bytes()).hexdigest()==digest for name,digest in old.items())
          print(f'Preserved {len(old)} existing files byte-for-byte')
          (root/'lens-02-clean-icon/preservation.json').write_text(json.dumps({'baseline_run':39211660554,'files_preserved':len(old),'all_hashes_match':True}))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview-output
  deploy:
    if: false
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish only isolated preview host after review
        id: deployment
        uses: actions/deploy-pages@v4
