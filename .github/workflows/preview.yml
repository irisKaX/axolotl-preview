name: Axolotl preview deployment

on:
  push:
    branches: [preview/header-responsive-lab]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: axolotl-preview-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed Header Labs commit
        uses: actions/checkout@v4
        with:
          repository: irisKaX/axolotl-2
          ref: f25ab73bfb4f7d1de6bc63215c6247dc91bd29d6
          persist-credentials: false

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Set preview URL base
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("vite.config.ts")
          content = p.read_text()
          old = 'base: "/axolotl-2/",'
          assert content.count(old) == 1, "Unexpected Vite base config"
          p.write_text(content.replace(old, 'base: "/axolotl-preview/",'))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build preview
        run: npm run build

      - name: Checkout isolated header (pinned, separate source directory)
        uses: actions/checkout@v4
        with:
          repository: irisKaX/axolotl-2
          ref: 6eec4da6e44772b4c8a19029cfaeb387dfdc543d
          path: _header-source
          persist-credentials: false

      - name: Install isolated header dependencies
        working-directory: _header-source
        run: npm ci

      - name: Verify isolated header unit tests
        working-directory: _header-source
        run: npm test

      - name: Build isolated header
        working-directory: _header-source
        env:
          AXO_PREVIEW_BASE: /axolotl-preview/header-rebuild/
        run: npm run build:header

      - name: Add isolated header without replacing existing labs
        run: |
          mkdir -p dist/header-rebuild/evidence
          cp -a _header-source/dist-header-rebuild/. dist/header-rebuild/
          cp dist/header-rebuild/header-rebuild.html dist/header-rebuild/index.html
          cp -a _header-source/docs/header-rebuild/. dist/header-rebuild/evidence/
          printf '%s\n' '6eec4da6e44772b4c8a19029cfaeb387dfdc543d' > dist/header-rebuild/source-commit.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
