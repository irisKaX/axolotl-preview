name: Dark Veil isolated background lab
on:
  push:
    branches: [preview/dark-veil-lab-20261018]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: axolotl-preview-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: irisKaX/axolotl-2
          ref: b9bfb20f7a4baa6142d5491c8151c56397d4b6aa
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Typecheck and unchanged header tests
        run: |
          npx tsc --noEmit
          npx vitest run src/app/header/Header.test.tsx
      - name: Build isolated Dark Veil entrypoint
        run: node src/experiments/dark-veil/build.mjs
      - run: npx playwright install --with-deps chromium
      - name: Verify visual, interactive, responsive and fallback behavior
        run: |
          npx vite preview --config src/experiments/dark-veil/vite.config.ts --host 127.0.0.1 --port 4191 > /tmp/veil-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4191/axolotl-preview/dark-veil-lab/ > /dev/null; then break; fi
            sleep 1
          done
          node src/experiments/dark-veil/check-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dark-veil-evidence
          path: docs/dark-veil/
          retention-days: 30
      - name: Guard against replacing a newer preview publication
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.actions.listWorkflowRunsForRepo({owner: context.repo.owner, repo: context.repo.repo, status: 'success', per_page: 10});
            const latest = data.workflow_runs.find(run => run.id !== context.runId);
            if (latest?.id !== 39153208785) throw new Error('Preview baseline changed; stop instead of replacing newer experiments.');
      - name: Restore current preview without rebuilding previous experiments
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: 39153208785
          github-token: ${{ github.token }}
          repository: irisKaX/axolotl-preview
          path: previous-preview
      - name: Add only new lab and verify all preexisting file hashes
        run: |
          mkdir -p preview-output
          tar -xf previous-preview/artifact.tar -C preview-output
          python3 - <<'PY'
          import pathlib,hashlib,json
          root=pathlib.Path('preview-output')
          manifest={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          pathlib.Path('previous-hashes.json').write_text(json.dumps(manifest))
          assert not (root/'dark-veil-lab').exists(), 'Do not overwrite existing content'
          PY
          mkdir -p preview-output/dark-veil-lab/evidence
          cp -R dist-dark-veil/. preview-output/dark-veil-lab/
          cp -R docs/dark-veil/. preview-output/dark-veil-lab/evidence/
          printf '%s\n' 'b9bfb20f7a4baa6142d5491c8151c56397d4b6aa' > preview-output/dark-veil-lab/source-commit.txt
          python3 - <<'PY'
          import pathlib,hashlib,json
          root=pathlib.Path('preview-output')
          old=json.loads(pathlib.Path('previous-hashes.json').read_text())
          assert all(hashlib.sha256((root/name).read_bytes()).hexdigest()==digest for name,digest in old.items())
          print(f'Preserved {len(old)} preexisting files byte-for-byte')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview-output
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish isolated preview host only
        id: deployment
        uses: actions/deploy-pages@v4
