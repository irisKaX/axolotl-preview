name: Canonical Design System Library V1.1
on:
  push:
    branches: [design-system/header-final-polish]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: axolotl-preview-pages
  cancel-in-progress: false
env:
  SOURCE_COMMIT: c4b47d40574537b6f516bfdcf385248894f9c7ec
  # Harness is pinned to canonical source; reference remains a separate immutable commit.
  TEST_COMMIT: c4b47d40574537b6f516bfdcf385248894f9c7ec
  BASELINE_COMMIT: 119fc3995442dff4dffee91372bcef570ac0c3f0
  BASELINE_SHA256: 4f288b9ae75e87ee9960e770f0a385e80bf5bd914b33bb7a7bca5ac3a0ac68d6
jobs:
  build:
    if: github.repository == 'irisKaX/axolotl-preview' && github.ref == 'refs/heads/design-system/header-final-polish'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: preview
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: irisKaX/axolotl-2
          ref: ${{ env.SOURCE_COMMIT }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: irisKaX/axolotl-2
          ref: ${{ env.TEST_COMMIT }}
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: irisKaX/axolotl-2
          ref: ${{ env.BASELINE_COMMIT }}
          path: reference
          persist-credentials: false
      - name: Build locked local/CI rendering environment
        run: docker build --file harness/scripts/visual-baseline/Dockerfile --tag axolotl-milestone-a:test harness/scripts/visual-baseline
      - name: Build, full tests and mandatory independent baseline gate
        env:
          BASELINE_DIR: ${{ github.workspace }}/reference/tests/visual/approved-v1-1
          VISUAL_HARNESS_DIR: ${{ github.workspace }}/harness/scripts/visual-baseline
          SOURCE_DIR: ${{ github.workspace }}/source
          PREVIEW_DIR: ${{ github.workspace }}/preview
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=$GITHUB_WORKSPACE" \
            --mount "type=bind,src=$RUNNER_TEMP,dst=$RUNNER_TEMP" \
            --mount "type=bind,src=$BASELINE_DIR,dst=$BASELINE_DIR,readonly" \
            --workdir "$SOURCE_DIR" \
            -e SOURCE_DIR -e PREVIEW_DIR -e VISUAL_HARNESS_DIR -e SOURCE_COMMIT \
            -e BASELINE_DIR -e BASELINE_SHA256 -e RUNNER_TEMP \
            -e NPM_CONFIG_CACHE="$RUNNER_TEMP/npm-cache" \
            axolotl-milestone-a:test bash "$VISUAL_HARNESS_DIR/ci.sh"
      - name: Preserve test evidence (never part of the Pages artifact)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: baseline-test-evidence
          path: |
            ${{ runner.temp }}/baseline-comparison
            ${{ runner.temp }}/baseline-negative.json
            ${{ runner.temp }}/library-preview.log
            ${{ runner.temp }}/lens-preview.log
          if-no-files-found: warn
          retention-days: 14
      - name: Assemble preview artifact in the same locked Node environment
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=$GITHUB_WORKSPACE" \
            --workdir "$GITHUB_WORKSPACE/preview" \
            -e SOURCE_COMMIT -e BASELINE_SHA256 \
            axolotl-milestone-a:test node scripts/assemble-library.mjs ../source/dist ../preview-output
      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview-output
          retention-days: 7
  deploy:
    if: github.repository == 'irisKaX/axolotl-preview' && github.ref == 'refs/heads/design-system/header-final-polish'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Confirm the experimental Pages target
        uses: actions/github-script@v7
        with:
          script: |
            if (context.repo.repo !== 'axolotl-preview') throw new Error('Preview repository only');
            const {data} = await github.rest.repos.getPages(context.repo);
            if (data.build_type !== 'workflow' || data.html_url !== 'https://iriskax.github.io/axolotl-preview/') throw new Error('Unexpected Pages target');
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify the published source and retired Playground
        env:
          LIBRARY_URL: https://iriskax.github.io/axolotl-preview/ds-library-v1-1/
          PREVIEW_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          url=os.environ['LIBRARY_URL']+'provenance.json'
          for attempt in range(12):
              try:
                  data=json.load(urllib.request.urlopen(url,timeout=30))
                  assert data['previewCommit']==os.environ['SOURCE_COMMIT']
                  assert data['previewRepositoryCommit']==os.environ['PREVIEW_COMMIT']
                  assert data['sourceCommit']==os.environ['SOURCE_COMMIT']
                  assert data['sourceClean'] is True
                  assert 'previewPatch' not in data
                  assert data['architecture']=='react-canonical-v2'
                  assert data['theme']=='tweakcn-v1'
                  assert data['themeRevision']=='contrast-v1'
                  body=urllib.request.urlopen('https://iriskax.github.io/axolotl-preview/creative-concepts/modular-playground/',timeout=30).read().decode()
                  assert '?section=dashboard#design-system' in body
                  print('Published canonical React Library and Dashboard redirect verified.')
                  break
              except Exception:
                  if attempt==11: raise
                  time.sleep(10)
          PY
